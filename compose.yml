x-workload-secret: &workload-secret ${WORKLOAD_JWT_SECRET:-docker-demo-only-workload-secret-change-me}
x-eureka-url: &eureka-url http://discovery-server:8761/eureka
x-activemq-url: &activemq-url tcp://activemq:61616?connectionTimeout=2000
x-activemq-user: &activemq-user ${ACTIVEMQ_USER:-gymcrm}
x-activemq-password: &activemq-password ${ACTIVEMQ_PASSWORD:-docker-demo-only-broker-password}

services:
  postgres:
    image: postgres:17-alpine
    container_name: gymcrm-db
    environment:
      POSTGRES_DB: gymcrm
      POSTGRES_USER: gymcrm
      POSTGRES_PASSWORD: gymcrm
    volumes:
      - gymcrm-data:/var/lib/postgresql/data
    networks:
      - gymcrm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymcrm -d gymcrm"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Carries added and deleted trainings from Gym CRM to the Trainer Workload service.
  activemq:
    image: apache/activemq-classic:6.2.0
    container_name: gymcrm-activemq
    environment:
      # Clients must log in with this user (the image turns on authentication when it is set).
      ACTIVEMQ_CONNECTION_USER: *activemq-user
      ACTIVEMQ_CONNECTION_PASSWORD: *activemq-password
      # The web console at http://localhost:8161/admin (queues, messages, dead letters).
      ACTIVEMQ_WEB_USER: ${ACTIVEMQ_WEB_USER:-admin}
      ACTIVEMQ_WEB_PASSWORD: ${ACTIVEMQ_WEB_PASSWORD:-admin}
    ports:
      - "${ACTIVEMQ_CONSOLE_PORT:-8161}:8161"
    volumes:
      # Persistent messages are stored on disk: queued trainings survive a broker restart.
      - activemq-data:/opt/apache-activemq/data
    networks:
      - gymcrm-net
    healthcheck:
      # The broker accepts connections on its OpenWire port.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/61616'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    image: gymcrm-discovery-server:1.0
    container_name: gymcrm-discovery
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    networks:
      - gymcrm-net
    restart: unless-stopped

  trainer-workload:
    build:
      context: .
      dockerfile: trainer-workload/Dockerfile
    image: trainer-workload:1.0
    container_name: gymcrm-workload
    environment:
      EUREKA_URL: *eureka-url
      WORKLOAD_JWT_SECRET: *workload-secret
      ACTIVEMQ_URL: *activemq-url
      ACTIVEMQ_USER: *activemq-user
      ACTIVEMQ_PASSWORD: *activemq-password
    ports:
      - "${WORKLOAD_PORT:-8081}:8081"
    networks:
      - gymcrm-net
    depends_on:
      # Register only once Eureka answers its health check (not just once its container started).
      discovery-server:
        condition: service_healthy
      activemq:
        condition: service_healthy
    restart: unless-stopped

  gym-crm:
    build: .
    image: gym-crm:1.0
    container_name: gymcrm-app
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_USERNAME: gymcrm
      DB_PASSWORD: gymcrm
      EUREKA_URL: *eureka-url
      WORKLOAD_JWT_SECRET: *workload-secret
      ACTIVEMQ_URL: *activemq-url
      ACTIVEMQ_USER: *activemq-user
      ACTIVEMQ_PASSWORD: *activemq-password
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - gymcrm-net
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      activemq:
        condition: service_healthy
      # Deliberately not the Trainer Workload service: Gym CRM starts without it. Trainings wait in the
      # queue until it is back; only reading a workload answers 503 meanwhile (timeouts + circuit breaker).
    restart: unless-stopped

networks:
  gymcrm-net:
    name: gymcrm-net
    driver: bridge

volumes:
  gymcrm-data:
  activemq-data:

# All data is lost when the application stops.
spring:
  datasource:
    url: jdbc:h2:mem:gymcrm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 5

logging:
  level:
    io.gymcrm: DEBUG

management:
  endpoint:
    health:
      show-details: always

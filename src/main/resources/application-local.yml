spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gymcrm
    username: ${DB_USERNAME:gymcrm}
    password: ${DB_PASSWORD:gymcrm}
    hikari:
      maximum-pool-size: 5
  jpa:
    show-sql: true

logging:
  level:
    io.gymcrm: DEBUG

management:
  endpoint:
    health:
      show-details: always

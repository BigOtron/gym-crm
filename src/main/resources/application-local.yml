spring:
  datasource:
    # In Docker, DB_HOST points to the database container instead (see docker-compose.yml).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/gymcrm
    username: ${DB_USERNAME:gymcrm}
    password: ${DB_PASSWORD:gymcrm}
    hikari:
      maximum-pool-size: 5
  jpa:
    show-sql: true

logging:
  level:
    io.gymcrm: DEBUG

management:
  endpoint:
    health:
      show-details: always

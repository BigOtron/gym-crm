spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:dev-db.gymcrm.internal}:${DB_PORT:5432}/gymcrm_dev
    username: ${DB_USERNAME:gymcrm_dev}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

logging:
  level:
    io.gymcrm: DEBUG

management:
  endpoint:
    health:
      show-details: always

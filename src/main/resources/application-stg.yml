spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:stg-db.gymcrm.internal}:${DB_PORT:5432}/gymcrm_stg
    username: ${DB_USERNAME:gymcrm_stg}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15

logging:
  level:
    io.gymcrm: INFO

gymcrm:
  logging:
    time-format: yyyy-MM-dd HH:mm:ss.SSS

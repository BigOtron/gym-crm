spring:
  application:
    name: gym-crm
  profiles:
    default: local

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  activemq:
    # The broker that carries added and deleted trainings to the Trainer Workload service. A broker that
    # doesn't answer is given up on after 2 s (503) instead of the default 30 s.
    broker-url: ${ACTIVEMQ_URL:tcp://localhost:61616?connectionTimeout=2000}
    user: ${ACTIVEMQ_USER:}
    password: ${ACTIVEMQ_PASSWORD:}
  jms:
    template:
      session:
        # Ties each message to the database transaction: sent after the commit, dropped on a rollback.
        transacted: true

  cloud:
    circuitbreaker:
      resilience4j:
        # Run the call on the request's own thread: it keeps the transaction, the logged-in user and the
        # transaction id. Calls that hang are stopped by the HTTP timeouts above instead of a time limiter.
        disable-thread-pool: true
        disable-time-limiter: true
    loadbalancer:
      cache:
        # How long the list of workload instances from Eureka is reused.
        ttl: 5s

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: true
    registry-fetch-interval-seconds: 5
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 5
  instance:
    # Registers the container's current IP, which Docker assigns at startup (nothing is hard-coded).
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15


management:
  health:
    jms:
      # Like the workload service, the broker is not needed to run Gym CRM: an outage gives 503s when adding
      # a training or deleting a trainee, but must not mark the whole application DOWN.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-components: always
      show-details: never
      status:
        order: DOWN, OUT_OF_SERVICE, WARNING, UP, UNKNOWN
        http-mapping:
          WARNING: 200
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: Gym CRM
    description: Trainees, trainers and their trainings

gymcrm:
  security:
    jwt:
      # How long a token stays valid. The signing secret is set per environment.
      lifetime: 1h
    login:
      # Brute-force protection: this many failures in a row block the username for this long.
      max-failures: 3
      block-duration: 5m
  logging:
    # Servers (stg, prod) keep logs for days, so they add the date.
    time-format: HH:mm:ss.SSS
  health:
    database:
      max-response-time: 500ms
  workload:
    # Report trainings to the Trainer Workload service (off in the standalone profile and in tests).
    enabled: true
    # Added and deleted trainings are sent here (the service's listener reads them).
    queue: trainer-workload.updates
    # Workloads are read over REST: "trainer-workload" is the service's name in Eureka; the load balancer
    # turns it into an address.
    url: http://trainer-workload
    connect-timeout: 2s
    read-timeout: 3s
    jwt:
      # The signing secret is shared with the workload service and set per environment.
      lifetime: 5m
    circuit-breaker:
      # Of the last 10 calls (at least 4), if half fail, fail fast for 10 s, then let 2 trial calls through.
      sliding-window-size: 10
      minimum-number-of-calls: 4
      failure-rate-threshold: 50
      wait-duration-in-open-state: 10s
      permitted-calls-in-half-open-state: 2

logging:
  # Spring Boot's own Logback setup with our pattern (transaction id from the MDC). It writes to the
  # console, and also to a file when logging.file.name is set (e.g. LOGGING_FILE_NAME in Docker).
  pattern:
    console: "%d{${gymcrm.logging.time-format}} %-5level [%X{transactionId:--}] [%thread] %logger{36} - %msg%n"
    file: "%d{${gymcrm.logging.time-format}} %-5level [%X{transactionId:--}] [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    com.netflix: WARN
